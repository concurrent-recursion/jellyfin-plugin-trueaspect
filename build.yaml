name: "TrueAspect"
guid: "b3512314-ef01-4cde-8b1b-71b3ef6046a0"
version: "1.0.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "concurrent_recursion"
category: "General"
overview: "Letterbox-aware aspect ratio detection with playback webhooks."
description: >-
  Detects the real picture aspect ratio of movies, including letterboxed files where the
  black bars are baked into a 16:9 frame, and pushes it to a webhook such as Home Assistant
  when playback starts. Built for switching projector lens memories.
image: "assets/trueaspect.png"
artifacts:
  - "Jellyfin.Plugin.TrueAspect.dll"
changelog: >-
  New plugin icon. The detector now releases its scan lock cleanly when Jellyfin shuts down.
  Behind the scenes the code builds with the Jellyfin plugin template's analyzers and treats
  warnings as errors, and the repo gained debug setups for Rider and VS Code. Settings, stored
  results, the API and the webhook payload are unchanged.
