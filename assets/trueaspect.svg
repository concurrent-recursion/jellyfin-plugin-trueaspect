<svg xmlns="http://www.w3.org/2000/svg" width="286" height="158" viewBox="0 0 286 158" fill="none">
  <defs>
    <!-- Jellyfin-inspired border & frame gradients -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="286" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AA5CC3" />
      <stop offset="50%" stop-color="#6B83D9" />
      <stop offset="100%" stop-color="#2AE2FF" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="286" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131924" />
      <stop offset="100%" stop-color="#0E141D" />
    </linearGradient>

    <linearGradient id="outerFrameGrad" x1="77" y1="14" x2="209" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B8F4" />
      <stop offset="45%" stop-color="#A678DE" />
      <stop offset="100%" stop-color="#38E2FF" />
    </linearGradient>

    <linearGradient id="glassSheen" x1="120" y1="20" x2="175" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="51%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cylon red scanner gradients -->
    <linearGradient id="cylonBeam" x1="52" y1="55" x2="234" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1E1E" stop-opacity="0" />
      <stop offset="22%" stop-color="#FF1E1E" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FF4D4D" stop-opacity="1" />
      <stop offset="78%" stop-color="#FF1E1E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FF1E1E" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="cylonCore" cx="143" cy="55" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="14%" stop-color="#FFD4D4" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FF2A2A" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#D90000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow filters -->
    <filter id="frameGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Jellyfin-accented card border -->
  <rect x="0" y="0" width="286" height="158" rx="6" fill="url(#borderGrad)" />
  <rect x="4" y="4" width="278" height="150" rx="4" fill="url(#bgGrad)" />

  <!-- Subtle ambient glow behind the nested frames -->
  <ellipse cx="115" cy="55" rx="45" ry="36" fill="#AA5CC3" fill-opacity="0.16" />
  <ellipse cx="171" cy="55" rx="45" ry="36" fill="#00A4DC" fill-opacity="0.16" />

  <!-- Outer 21:9 / wide frame -->
  <g filter="url(#frameGlow)">
    <rect x="77" y="14" width="132" height="82" rx="1.5" fill="#182230" fill-opacity="0.55" stroke="url(#outerFrameGrad)" stroke-width="1.6" />
  </g>

  <!-- Outer viewfinder corner brackets -->
  <g stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="square">
    <path d="M81 24 V18 H87" />
    <path d="M199 18 H205 V24" />
    <path d="M81 86 V92 H87" />
    <path d="M199 92 H205 V86" />
  </g>

  <!-- Middle 16:9 rounded frame -->
  <rect x="94" y="20" width="98" height="70" rx="5" fill="#1A2636" fill-opacity="0.72" stroke="#38BDF8" stroke-width="1.3" />
  <rect x="94" y="20" width="98" height="70" rx="5" fill="url(#glassSheen)" />

  <!-- Inner 4:3 frame -->
  <rect x="118" y="34" width="50" height="42" rx="1" fill="#1E2C3E" fill-opacity="0.45" stroke="#BAE6FD" stroke-width="1.1" />
  <g stroke="#E0F2FE" stroke-width="1.2" stroke-linecap="square">
    <path d="M121 41 V37 H125" />
    <path d="M161 37 H165 V41" />
    <path d="M121 69 V73 H125" />
    <path d="M161 73 H165 V69" />
  </g>

  <!-- Cylon-inspired glowing red horizontal scanner -->
  <circle cx="143" cy="55" r="34" fill="url(#cylonCore)" />
  <g filter="url(#redGlow)">
    <rect x="52" y="53.6" width="182" height="2.8" rx="1.4" fill="url(#cylonBeam)" />
    <rect x="95" y="54.3" width="96" height="1.4" rx="0.7" fill="#FF6B6B" fill-opacity="0.9" />
  </g>
  <ellipse cx="143" cy="55" rx="7" ry="2.2" fill="#FFFFFF" />

  <!-- Large, high-contrast TrueAspect wordmark -->
  <text x="143" y="138" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">True</tspan><tspan fill="#5CE1FF">Aspect</tspan>
  </text>
</svg>