name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "homeassistant/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "homeassistant/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install jprm
        run: pip install jprm==1.1.0

      - name: Build plugin
        id: build
        run: |
          mkdir -p artifacts
          zip="$(jprm plugin build . --output artifacts | tail -n 1)"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TrueAspect-${{ github.sha }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
